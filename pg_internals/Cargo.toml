[package]
name = "pg_internals"
version = "0.1.0"
edition = "2024"

[dependencies]
phf = "0.13"
thiserror = "2"

[build-dependencies]
cc = "1"
bindgen = "0.72"
clang-sys = { version = "1", features = ["runtime", "clang_11_0"] }
phf_codegen = "0.13"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
