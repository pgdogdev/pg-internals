name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev bison flex pkg-config libicu-dev libreadline-dev zlib1g-dev
      - name: Build
        run: cargo build --workspace --all-targets --locked

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev bison flex pkg-config libicu-dev libreadline-dev zlib1g-dev
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Test
        run: cargo nextest run --workspace --all-targets --locked
